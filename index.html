ts of each artist', 'Music, interests and fun facts in their own words', 'Any additional resident or apprentice artists'] },\n  { title: 'Photography', items: ['High-resolution originals for every image currently on the site — the supplied files are only 150px wide and look soft at full size', 'Studio interior photos — walls, plants, furniture, flash', 'Candid photos of artists working and clients hanging out', 'High-resolution portfolio images (1600–2200px) for the gallery', 'Event and Tokyo pop-up photo galleries', 'Product photos for prints, shirts, zines and stickers'] },\n  { title: 'Flash & gallery data', items: ['Real design names, sizes, placements and availability', 'Which designs are claimed, repeatable or one-of-one', 'Artist credit for every gallery image', 'Short story or inspiration notes where they exist'] },\n  { title: 'Events', items: ['Confirmed guest artist names and dates', 'Tokyo pop-up host studio and dates', 'Friday the 13th details', 'RSVP or ticket links'] },\n  { title: 'Reviews & legal', items: ['Links to verified Google or Yelp reviews (none have been invented)', 'Business licence and health permit details if displayed', 'Privacy notice for the booking form and uploads'] }\n];\n\nconst NAV = [\n  ['home', 'Home'], ['artists', 'Artists'], ['gallery', 'Tattoos'], ['flash', 'Flash'],\n  ['events', 'Events'], ['studio', 'Studio'], ['care', 'Prep & FAQ'], ['visit', 'Visit']\n];\n\nconst STEPS = ['Your idea', 'Size & place', 'Artist & style', 'When & budget', 'Photos & you'];\nconst FORM_KEY = 'gwt_booking_draft_v1';\n\nclass Component extends DCLogic {\n  state = {\n    page: 'home', menuOpen: false, gFilter: 'All', fFilter: 'All',\n    lightbox: null, lbList: 'gallery', step: 0, submitted: false, error: '',\n    form: { idea: '', mood: '', size: '', placement: '', artist: 'Not sure — help me pick', style: '', color: 'Not sure yet', dates: '', budget: '', name: '', email: '', phone: '', notes: '' },\n    showTop: false, copied: false, artistKey: 'eric',\n    query: '', fAvail: 'All', fArtist: 'All Artists', fStyles: [], fSizes: [], fMoods: [],\n    view: 'wall', savedOpen: false, adminOpen: false, showArchived: false,\n    favorites: [], cms: {}, viewer: null, toast: '', eggOn: false, requested: null,\n    isDesktop: typeof window !== 'undefined' ? window.innerWidth >= 1080 : true\n  };\n\n  componentDidMount() {\n    this._mq = window.matchMedia('(min-width: 1080px)');\n    this._onMq = (e) => this.setState({ isDesktop: e.matches, menuOpen: e.matches ? false : this.state.menuOpen });\n    this.setState({ isDesktop: this._mq.matches });\n    if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq); else this._mq.addListener(this._onMq);\n    try {\n      const saved = localStorage.getItem(FORM_KEY);\n      if (saved) this.setState({ form: Object.assign({}, this.state.form, JSON.parse(saved)) });\n    } catch (e) {}\n    try {\n      const fav = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');\n      const cms = JSON.parse(localStorage.getItem(CMS_KEY) || '{}');\n      const view = sessionStorage.getItem(VIEW_KEY);\n      this.setState({ favorites: Array.isArray(fav) ? fav : [], cms: cms || {}, view: view === 'grid' ? 'grid' : 'wall' });\n    } catch (e) {}\n    const hash = (window.location.hash || '').replace('#', '');\n    if (hash.indexOf('flash/') === 0) {\n      const slug = hash.slice(6);\n      const hit = FLASH.filter(f => f.slug === slug)[0];\n      if (hit) this.setState({ page: 'flash', viewer: hit.id });\n    }\n    this._onScroll = () => {\n      const s = window.scrollY > 700;\n      if (s !== this.state.showTop) this.setState({ showTop: s });\n    };\n    this._onKey = (e) => {\n      if (this.state.viewer) {\n        if (e.key === 'Escape') this.closeViewer();\n        if (e.key === 'ArrowRight') this.viewerStep(1);\n        if (e.key === 'ArrowLeft') this.viewerStep(-1);\n        return;\n      }\n      if (this.state.lightbox === null) { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); return; }\n      if (e.key === 'Escape') this.setState({ lightbox: null });\n      if (e.key === 'ArrowRight') this.step(1);\n      if (e.key === 'ArrowLeft') this.step(-1);\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('keydown', this._onKey);\n    if (this._mq) { if (this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq); else this._mq.removeListener(this._onMq); }\n  }\n\n  go(page, artistKey) {\n    const next = { page: page, menuOpen: false };\n    if (artistKey) next.artistKey = artistKey;\n    this.setState(next);\n    window.scrollTo({ top: 0, behavior: 'auto' });\n  }\n\n  lbSource() { return this.filteredGallery().map(g => ({ src: g.src, title: g.title, meta: g.artist + ' · ' + g.style + ' · ' + g.placement })); }\n  step(d) {\n    const list = this.lbSource();\n    if (!list.length) return;\n    this.setState({ lightbox: (this.state.lightbox + d + list.length) % list.length });\n  }\n\n  filteredGallery() {\n    const f = this.state.gFilter;\n    return f === 'All' ? GALLERY : GALLERY.filter(g => g.tags.indexOf(f) > -1);\n  }\n  entry(f) {\n    const o = this.state.cms[f.id] || {};\n    return Object.assign({}, f, o);\n  }\n  allFlash() { return FLASH.map(f => this.entry(f)); }\n\n  filteredFlash() {\n    const st = this.state;\n    const q = st.query.trim().toLowerCase();\n    return this.allFlash().filter(f => {\n      if (f.status === 'archived' && !st.showArchived) return false;\n      if (st.fAvail !== 'All' && f.status !== st.fAvail) return false;\n      if (st.fArtist !== 'All Artists' && f.artist !== st.fArtist) return false;\n      if (st.fStyles.length && !st.fStyles.some(s => f.styles.indexOf(s) > -1)) return false;\n      if (st.fSizes.length && st.
