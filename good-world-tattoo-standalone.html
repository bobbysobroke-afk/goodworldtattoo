ing=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;border:5px solid #FFF6E4;box-shadow:6px 6px 0 #342A24;\">\n          <\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"position:absolute;bottom:6%;right:2%;width:82px;height:82px;border-radius:50%;background:#D4A636;border:4px solid #342A24;display:grid;place-items:center;font-family:Shrikhand,Georgia,serif;font-size:13px;text-align:center;line-height:1.1;color:#342A24;animation:gw-spin 60s linear infinite;\">good<br>world<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#F4E8CB;padding:clamp(44px,7vw,92px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;\">\n      <div style=\"max-width:900px;margin:0 auto;text-align:center;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(30px,5vw,56px);margin:0 0 20px;\">Welcome to Good World<\u002Fh2>\n        <p style=\"font-size:19px;line-height:1.7;margin:0 0 16px;\">Good World Tattoo is a relaxed, artist-driven tattoo studio in Sacramento. Getting tattooed should feel exciting, comfortable and personal — not intimidating.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.7;margin:0 0 30px;\">Bring us your idea, your sketch, your strange dream or just a general feeling. We'll talk it through, make something original and have a good time along the way.<\u002Fp>\n        <p style=\"display:inline-block;background:#CE858A;border:3px solid #342A24;border-radius:22px;padding:20px 28px;transform:rotate(-1.2deg);box-shadow:6px 6px 0 #342A24;font-family:Shrikhand,Georgia,serif;font-size:clamp(19px,2.6vw,28px);margin:0;line-height:1.3;\">No pressure. No attitude.<br>Just good work and good energy.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#75814F;padding:clamp(44px,7vw,88px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,50px);margin:0 0 6px;color:#FFF6E4;\">Meet the Artists<\u002Fh2>\n        <p style=\"font-family:Caveat,cursive;font-size:26px;color:#F0E2BE;margin:0 0 30px;\">Currently floating around the studio.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;\">\n          <sc-for list=\"{{ artists }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <article style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:22px;padding:20px;box-shadow:7px 7px 0 #342A24;\">\n              <img src=\"{{ a.photo }}\" alt=\"{{ a.photoAlt }}\" width=\"800\" height=\"600\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border:3px solid #342A24;border-radius:14px;\">\n              <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:29px;margin:16px 0 4px;\">{{ a.name }}<\u002Fh3>\n              <p style=\"margin:0 0 10px;font-weight:800;color:#B04A28;\">{{ a.styles }}<\u002Fp>\n              <p style=\"margin:0 0 16px;line-height:1.65;\">{{ a.intro }}<\u002Fp>\n              <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"padding:13px 22px;border-radius:999px;background:#438A84;color:#FFF6E4;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Meet {{ a.first }}<\u002Fbutton>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#F4E8CB;padding:clamp(44px,7vw,88px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:26px;\">\n          <div>\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,50px);margin:0;\">Fresh From the Studio<\u002Fh2>\n            <p style=\"font-family:Caveat,cursive;font-size:26px;margin:4px 0 0;color:#B04A28;\">See what we've been making.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goGallery }}\" style=\"padding:14px 24px;border-radius:999px;background:#D4A636;color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Browse the Gallery<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;\">\n          <sc-for list=\"{{ featured }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ g.onOpen }}\" aria-label=\"{{ g.openLabel }}\" style=\"padding:0;border:3px solid #342A24;background:#FFF6E4;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 #342A24;transition:transform 0.15s,box-shadow 0.15s;\" style-hover=\"transform:translate(-2px,-2px);box-shadow:7px 7px 0 #342A24;\">\n              <img src=\"{{ g.src }}\" alt=\"{{ g.title }}\" width=\"600\" height=\"600\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#775D7B;padding:clamp(44px,7vw,88px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;\">\n      <div style=\"max-width:1100px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,50px);margin:0 0 26px;color:#FFF6E4;\">What We're About<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(226px,1fr));gap:20px;\">\n          <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"5\">\n            <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:18px;padding:20px;box-shadow:5px 5px 0 #342A24;\">\n              <div aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:{{ v.dot }};border:3px solid #342A24;margin-bottom:12px;\"><\u002Fdiv>\n              <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 8px;\">{{ v.title }}<\u002Fh3>\n              <p style=\"margin:0;line-height:1.6;font-size:17px;\">{{ v.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#86B5C4;padding:clamp(44px,7vw,88px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;\">\n      <div style=\"max-width:1050px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;align-items:center;\">\n        <div>\n          <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,48px);margin:0 0 14px;\">A Chill Place to Get Tattooed<\u002Fh2>\n          <p style=\"font-size:19px;line-height:1.7;margin:0 0 22px;\">You don't need to know tattoo terminology or show up with perfect reference images. Bring your idea, your story or your general feeling, and we'll help you figure out the rest.<\u002Fp>\n          <button sc-camel-on-click=\"{{ goStudio }}\" style=\"padding:14px 26px;border-radius:999px;background:#342A24;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #FFF6E4;cursor:pointer;min-height:44px;\">Look Around the Studio<\u002Fbutton>\n        <\u002Fdiv>\n        <img src=\"b0b84263-63a1-4bad-bbd7-2172b844c7bf\" alt=\"A fresh colour tattoo photographed outside the shop window\" width=\"800\" height=\"600\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border:4px solid #FFF6E4;box-shadow:8px 8px 0 #342A24;transform:rotate(1.2deg);\">\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#F4E8CB;padding:clamp(44px,7vw,88px) clamp(18px,5vw,64px);border-bottom:4px solid #342A24;text-align:center;\">\n      <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,50px);margin:0 0 12px;\">Got an Idea Today?<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.7;max-width:58ch;margin:0 auto 24px;\">Walk-ins are welcome whenever we have space. Smaller tattoos and available flash usually work best for same-day work. Send a message or stop by and say hello.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;\">\n        <button sc-camel-on-click=\"{{ goFlash }}\" style=\"padding:14px 26px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Browse Available Flash<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goWalkins }}\" style=\"padding:14px 26px;border-radius:999px;background:#D4A636;color:#342A24;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Check Walk-In Availability<\u002Fbutton>\n        <a href=\"https://maps.google.com/?q=2401+15th+Street+Sacramento+CA+95818\" target=\"_blank\" rel=\"noopener\" style=\"padding:14px 26px;border-radius:999px;background:#FFF6E4;color:#342A24;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;\">Get Directions<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isArtists }}\">\n    <section style=\"padding:clamp(32px,5vw,72px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,64px);margin:0 0 4px;\">The Artists<\u002Fh1>\n        <p style=\"font-family:Caveat,cursive;font-size:28px;color:#B04A28;margin:0 0 32px;\">Good art. Good conversations.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;\">\n          <sc-for list=\"{{ artists }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <article style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:24px;overflow:hidden;box-shadow:8px 8px 0 #342A24;\">\n              <img src=\"{{ a.photo }}\" alt=\"{{ a.photoAlt }}\" width=\"900\" height=\"640\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:7/5;object-fit:cover;border-bottom:3px solid #342A24;\">\n              <div style=\"padding:24px;\">\n                <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:32px;margin:0 0 4px;\">{{ a.name }}<\u002Fh2>\n                <p style=\"margin:0 0 12px;font-weight:800;color:#B04A28;\">{{ a.styles }}<\u002Fp>\n                <p style=\"margin:0 0 16px;line-height:1.65;\">{{ a.intro }}<\u002Fp>\n                <p style=\"margin:0 0 8px;font-weight:800;\">{{ a.first }} may be a good fit for:<\u002Fp>\n                <ul style=\"margin:0 0 16px;padding-left:20px;line-height:1.7;\">\n                  <sc-for list=\"{{ a.fitFor }}\" as=\"f\" hint-placeholder-count=\"4\"><li>{{ f }}<\u002Fli><\u002Fsc-for>\n                <\u002Ful>\n                <p style=\"margin:0 0 18px;font-weight:800;background:#D4A636;display:inline-block;padding:7px 15px;border-radius:999px;border:2px solid #342A24;\">{{ a.booking }}<\u002Fp>\n                <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"padding:13px 22px;border-radius:999px;background:#438A84;color:#FFF6E4;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">See {{ a.first }}'s Work<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onBook }}\" style=\"padding:13px 22px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Book With {{ a.first }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:30px;background:#86B5C4;border:3px solid #342A24;border-radius:22px;padding:24px;box-shadow:7px 7px 0 #342A24;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;\">\n          <div>\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:28px;margin:0 0 6px;\">Not sure who to choose?<\u002Fh2>\n            <p style=\"margin:0;font-size:17px;line-height:1.6;max-width:52ch;\">Tell us the idea and we'll point you at whoever fits it best. Nobody here is precious about it.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goBooking }}\" style=\"padding:15px 26px;border-radius:999px;background:#342A24;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #FFF6E4;cursor:pointer;min-height:44px;\">Find Your Artist<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isArtistPage }}\">\n    <section style=\"background:#D4A636;border-bottom:4px solid #342A24;padding:clamp(28px,4vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1150px;margin:0 auto;\">\n        <p style=\"margin:0 0 16px;font-weight:700;font-size:16px;\"><button sc-camel-on-click=\"{{ goArtists }}\" style=\"background:none;border:none;padding:6px 0;font-weight:800;font-size:16px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:#342A24;min-height:44px;\">← All artists<\u002Fbutton><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;align-items:center;\">\n          <div style=\"transform:rotate(-1.2deg);\">{{ artistPortrait }}<\u002Fdiv>\n          <div>\n            <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,60px);margin:0 0 10px;line-height:1;\">{{ artist.name }}<\u002Fh1>\n            <p style=\"font-size:19px;line-height:1.65;margin:0 0 18px;\">{{ artist.intro }}<\u002Fp>\n            <p style=\"font-weight:800;background:#FFF6E4;display:inline-block;padding:8px 16px;border-radius:999px;border:3px solid #342A24;margin:0 0 20px;\">{{ artist.booking }}<\u002Fp>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n              <button sc-camel-on-click=\"{{ goBooking }}\" style=\"padding:15px 26px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Book With {{ artist.first }}<\u002Fbutton>\n              <span style=\"padding:15px 24px;border-radius:999px;background:#FFF6E4;font-weight:800;border:3px dashed #342A24;font-size:16px;\">Instagram handle needed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"padding:clamp(36px,5vw,72px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1150px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;\">\n        <sc-for list=\"{{ artistCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:20px;padding:20px;box-shadow:6px 6px 0 #342A24;\">\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 10px;color:#B04A28;\">{{ c.title }}<\u002Fh2>\n            <p style=\"margin:0;line-height:1.65;font-size:17px;\">{{ c.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#438A84;border-top:4px solid #342A24;border-bottom:4px solid #342A24;padding:clamp(36px,5vw,72px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1150px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,42px);margin:0 0 20px;color:#FFF6E4;\">Selected Work<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;\">\n          <sc-for list=\"{{ artistWork }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ g.onOpen }}\" aria-label=\"{{ g.openLabel }}\" style=\"padding:0;border:4px solid #FFF6E4;background:#FFF6E4;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 #342A24;transition:transform 0.15s,box-shadow 0.15s;\" style-hover=\"transform:translate(-2px,-2px);box-shadow:8px 8px 0 #342A24;\">\n              <img src=\"{{ g.src }}\" alt=\"{{ g.title }}\" width=\"600\" height=\"600\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isGallery }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1300px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,64px);margin:0 0 4px;\">Tattoo Gallery<\u002Fh1>\n        <p style=\"font-family:Caveat,cursive;font-size:28px;color:#B04A28;margin:0 0 22px;\">Fresh tattoos from good people — tap anything to open it big.<\u002Fp>\n        <div role=\"group\" aria-label=\"Filter tattoos by style\" style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px;\">\n          <sc-for list=\"{{ galleryFilters }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ f.onClick }}\" aria-pressed=\"{{ f.active }}\" style=\"padding:10px 18px;border-radius:999px;border:3px solid #342A24;font-weight:800;font-size:15px;cursor:pointer;min-height:44px;background:{{ f.bg }};color:{{ f.fg }};\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ galleryEmpty }}\">\n          <p style=\"background:#FFF6E4;border:3px dashed #342A24;border-radius:20px;padding:34px;text-align:center;font-family:Shrikhand,Georgia,serif;font-size:24px;margin:0;\">Nothing in this corner yet. Try another filter.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"columns:270px;column-gap:18px;\">\n          <sc-for list=\"{{ galleryItems }}\" as=\"g\" hint-placeholder-count=\"9\">\n            <div style=\"break-inside:avoid;margin:0 0 18px;\">\n              <button sc-camel-on-click=\"{{ g.onOpen }}\" aria-label=\"{{ g.openLabel }}\" style=\"display:block;width:100%;padding:0;border:3px solid #342A24;background:#FFF6E4;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:6px 6px 0 #342A24;text-align:left;transition:transform 0.15s,box-shadow 0.15s;\" style-hover=\"transform:translate(-2px,-2px);box-shadow:9px 9px 0 #342A24;\">\n                <img src=\"{{ g.src }}\" alt=\"{{ g.title }}\" width=\"800\" height=\"800\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:{{ g.ratio }};object-fit:cover;\">\n                <sc-if value=\"{{ showCaptions }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"display:block;padding:12px 14px;border-top:3px solid #342A24;\">\n                    <span style=\"display:block;font-family:Shrikhand,Georgia,serif;font-size:17px;\">{{ g.title }}<\u002Fspan>\n                    <span style=\"display:block;font-size:14px;font-weight:700;color:#B04A28;\">{{ g.meta }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFlash }}\">\n    <section style=\"background:#B04A28;border-bottom:4px solid #342A24;padding:clamp(26px,4vw,54px) clamp(14px,4vw,56px);\">\n      <div style=\"max-width:1400px;margin:0 auto;\">\n        <a href=\"#gw-wall-skip\" style=\"position:absolute;left:-9999px;\" style-focus=\"position:static;display:inline-block;margin-bottom:10px;background:#FFF6E4;padding:10px 16px;border-radius:999px;font-weight:800;\">Skip the flash wall<\u002Fa>\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(30px,5.6vw,58px);margin:0 0 4px;color:#FFF6E4;\">Find Something That Finds You<\u002Fh1>\n        <p style=\"font-family:Caveat,cursive;font-size:27px;color:#F4E8CB;margin:0 0 20px;\">Sometimes the right tattoo is already waiting on the wall.<\u002Fp>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;\">\n          <button sc-camel-on-click=\"{{ pickWeird }}\" style=\"padding:13px 22px;border-radius:999px;background:#D4A636;color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Pick Something Weird<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleSaved }}\" aria-pressed=\"{{ savedOpen }}\" style=\"padding:13px 22px;border-radius:999px;background:{{ savedBtnBg }};color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Saved Flash ({{ savedCount }})<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleView }}\" style=\"padding:13px 22px;border-radius:999px;background:#FFF6E4;color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">{{ viewToggleLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ wallMode }}\">\n            <button sc-camel-on-click=\"{{ resetView }}\" style=\"padding:13px 22px;border-radius:999px;background:#FFF6E4;color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">Reset View<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ toggleAdmin }}\" aria-expanded=\"{{ adminOpen }}\" style=\"padding:13px 22px;border-radius:999px;background:none;color:#FFF6E4;font-weight:800;font-size:16px;border:3px dashed #FFF6E4;cursor:pointer;min-height:44px;\">Studio tools<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:20px;padding:18px;box-shadow:6px 6px 0 #342A24;margin-bottom:22px;\">\n          <label style=\"display:grid;gap:6px;font-weight:800;margin-bottom:14px;max-width:420px;\">Search the Wall\n            <input value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\" type=\"search\" placeholder=\"mushroom, dragon, snake, cosmic…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;min-height:44px;\">\n          <\u002Flabel>\n          <sc-for list=\"{{ filterGroups }}\" as=\"grp\" hint-placeholder-count=\"5\">\n            <div role=\"group\" aria-label=\"{{ grp.aria }}\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;\">\n              <span style=\"font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:0.06em;min-width:92px;\">{{ grp.name }}<\u002Fspan>\n              <sc-for list=\"{{ grp.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" aria-pressed=\"{{ o.active }}\" style=\"padding:9px 15px;border-radius:999px;border:3px solid #342A24;font-weight:800;font-size:14px;cursor:pointer;min-height:44px;background:{{ o.bg }};color:{{ o.fg }};\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;border-top:3px dashed #E0CFA6;padding-top:14px;\">\n            <p role=\"status\" aria-live=\"polite\" style=\"margin:0;font-weight:800;font-size:17px;\">{{ resultCount }}<\u002Fp>\n            <sc-if value=\"{{ hasActiveFilters }}\">\n              <button sc-camel-on-click=\"{{ clearFilters }}\" style=\"padding:11px 20px;border-radius:999px;background:#CE858A;color:#342A24;font-weight:800;font-size:15px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Clear Filters<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasActiveFilters }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;\">\n              <sc-for list=\"{{ activeChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ c.onRemove }}\" style=\"padding:8px 14px;border-radius:999px;background:#86B5C4;color:#342A24;font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ c.label }} ✕<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ adminOpen }}\">\n          <div style=\"background:#775D7B;border:3px solid #342A24;border-radius:20px;padding:20px;box-shadow:6px 6px 0 #342A24;margin-bottom:22px;\">\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:24px;margin:0 0 6px;color:#FFF6E4;\">Studio tools — flash manager<\u002Fh2>\n            <p style=\"margin:0 0 16px;color:#F4E8CB;font-size:16px;line-height:1.6;max-width:70ch;\">Change availability and featured status without touching code. Changes save in this browser as a preview of the CMS; wiring them to the real content store is a launch task.<\u002Fp>\n            <div style=\"display:grid;gap:10px;\">\n              <sc-for list=\"{{ adminRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;\">\n                  <img src=\"{{ r.src }}\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\" style=\"width:56px;height:56px;object-fit:cover;border:2px solid #342A24;border-radius:8px;\">\n                  <span style=\"font-weight:800;flex:1 1 160px;\">{{ r.title }}<br><span style=\"font-weight:600;font-size:14px;\">{{ r.artist }} · id {{ r.id }}<\u002Fspan><\u002Fspan>\n                  <label style=\"display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px;\">Status\n                    <sc-raw-select value=\"{{ r.status }}\" sc-camel-on-change=\"{{ r.onStatus }}\" style=\"padding:9px 10px;border:3px solid #342A24;border-radius:10px;min-height:44px;background:#fff;\">\n                      <option value=\"available\">Available<\u002Foption>\n                      <option value=\"repeatable\">Repeatable<\u002Foption>\n                      <option value=\"ask\">Ask the Artist<\u002Foption>\n                      <option value=\"pending\">Appointment Pending<\u002Foption>\n                      <option value=\"claimed\">Claimed<\u002Foption>\n                      <option value=\"archived\">Archived<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Flabel>\n                  <label style=\"display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px;min-height:44px;\">\n                    <input type=\"checkbox\" checked=\"{{ r.featured }}\" sc-camel-on-change=\"{{ r.onFeature }}\" style=\"width:22px;height:22px;\"> Featured\n                  <\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;\">\n              <button sc-camel-on-click=\"{{ adminReset }}\" style=\"padding:11px 20px;border-radius:999px;background:#FFF6E4;font-weight:800;font-size:15px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Reset to published values<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toggleArchive }}\" aria-pressed=\"{{ showArchived }}\" style=\"padding:11px 20px;border-radius:999px;background:{{ archiveBtnBg }};font-weight:800;font-size:15px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Show archived designs<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ savedOpen }}\">\n          <div style=\"background:#F4E8CB;border:3px solid #342A24;border-radius:20px;padding:20px;box-shadow:6px 6px 0 #342A24;margin-bottom:22px;\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;\">\n              <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:26px;margin:0;\">Saved Flash<\u002Fh2>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n                <sc-if value=\"{{ hasSaved }}\">\n                  <button sc-camel-on-click=\"{{ sendSaved }}\" style=\"padding:11px 20px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:15px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Send these as inspiration<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ hasSaved }}\">\n                  <button sc-camel-on-click=\"{{ clearSaved }}\" style=\"padding:11px 20px;border-radius:999px;background:none;font-weight:800;font-size:15px;border:3px dashed #342A24;cursor:pointer;min-height:44px;\">Clear all<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noSaved }}\">\n              <p style=\"margin:14px 0 0;font-size:17px;line-height:1.6;\">Nothing in your pile yet. Tap the sun on any design to save it.<\u002Fp>\n            <\u002Fsc-if>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px;\">\n              <sc-for list=\"{{ savedItems }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:14px;padding:10px;\">\n                  <button sc-camel-on-click=\"{{ s.onOpen }}\" aria-label=\"{{ s.openLabel }}\" style=\"display:block;width:100%;padding:0;border:2px solid #342A24;border-radius:10px;overflow:hidden;background:none;cursor:pointer;\">\n                    <img src=\"{{ s.src }}\" alt=\"{{ s.alt }}\" width=\"400\" height=\"400\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n                  <\u002Fbutton>\n                  <p style=\"margin:8px 0 6px;font-weight:800;font-size:14px;\">{{ s.title }}<\u002Fp>\n                  <button sc-camel-on-click=\"{{ s.onRemove }}\" style=\"padding:8px 12px;border-radius:999px;background:none;border:2px solid #342A24;font-weight:800;font-size:13px;cursor:pointer;min-height:44px;width:100%;\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showFeatured }}\">\n          <div style=\"margin-bottom:24px;\">\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,36px);margin:0 0 4px;color:#FFF6E4;\">Fresh From the Wall<\u002Fh2>\n            <p style=\"font-family:Caveat,cursive;font-size:24px;color:#F4E8CB;margin:0 0 14px;\">New stuff just landed.<\u002Fp>\n            <div style=\"display:flex;gap:16px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory;\">\n              <sc-for list=\"{{ featuredFlash }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ f.onOpen }}\" aria-label=\"{{ f.openLabel }}\" style=\"flex:none;width:210px;scroll-snap-align:start;background:#FFF6E4;border:3px solid #342A24;border-radius:16px;padding:10px;box-shadow:5px 5px 0 #342A24;cursor:pointer;text-align:left;\">\n                  <img src=\"{{ f.src }}\" alt=\"{{ f.alt }}\" width=\"500\" height=\"500\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;border:2px solid #342A24;border-radius:10px;\">\n                  <span style=\"display:block;font-family:Shrikhand,Georgia,serif;font-size:17px;margin:10px 0 4px;\">{{ f.title }}<\u002Fspan>\n                  <span style=\"display:block;font-size:14px;font-weight:700;\">{{ f.artist }} · {{ f.statusLabel }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ flashEmpty }}\">\n          <p style=\"background:#FFF6E4;border:3px dashed #342A24;border-radius:20px;padding:34px;text-align:center;font-family:Shrikhand,Georgia,serif;font-size:23px;margin:0 0 22px;\">Nothing in this corner yet. Try another combination.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ wallMode }}\">\n          <div tabindex=\"0\" role=\"region\" aria-label=\"Flash wall — drag or use arrow keys to explore\" ref=\"{{ wallRef }}\" sc-camel-on-key-down=\"{{ wallKey }}\" sc-camel-on-pointer-down=\"{{ wallDown }}\" style=\"overflow:auto;max-height:80vh;border:4px solid #342A24;border-radius:22px;background:#EADFC0;background-image:repeating-linear-gradient(90deg,rgba(52,42,36,0.05) 0 3px,transparent 3px 26px);cursor:grab;overscroll-behavior:contain;\">\n            <div style=\"columns:4;column-gap:26px;width:1800px;padding:26px;\">\n              <sc-for list=\"{{ flashItems }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <article style=\"break-inside:avoid;margin:0 0 26px;background:#FFF6E4;border:3px solid #342A24;border-radius:18px;padding:15px;box-shadow:7px 7px 0 rgba(52,42,36,0.85);position:relative;transform:rotate({{ f.tilt }});opacity:{{ f.dim }};\">\n                  <span aria-hidden=\"true\" style=\"position:absolute;top:-13px;left:50%;width:26px;height:26px;border-radius:50%;background:{{ f.pin }};border:3px solid #342A24;transform:translateX(-50%);\"><\u002Fspan>\n                  <button sc-camel-on-click=\"{{ f.onOpen }}\" aria-label=\"{{ f.openLabel }}\" style=\"display:block;width:100%;padding:0;border:3px solid #342A24;border-radius:12px;overflow:hidden;background:#FFF6E4;cursor:pointer;\">\n                    <img src=\"{{ f.src }}\" alt=\"{{ f.alt }}\" width=\"700\" height=\"700\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n                  <\u002Fbutton>\n                  <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:19px;margin:12px 0 6px;\">{{ f.title }}<\u002Fh3>\n                  <p style=\"margin:0 0 8px;font-size:15px;font-weight:700;\">{{ f.artist }} · {{ f.sizeLabel }} · {{ f.ink }}<\u002Fp>\n                  <p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;padding:5px 12px;border-radius:999px;border:2px solid #342A24;font-weight:800;font-size:13px;background:{{ f.statusBg }};\">{{ f.statusIcon }} {{ f.statusLabel }}<\u002Fspan><\u002Fp>\n                  <p style=\"font-family:Caveat,cursive;font-size:20px;margin:0 0 10px;color:#5A4A3E;\">“{{ f.note }}”<\u002Fp>\n                  <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                    <button sc-camel-on-click=\"{{ f.onRequest }}\" style=\"padding:10px 15px;border-radius:999px;background:{{ f.btnBg }};color:{{ f.btnFg }};font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ f.btnLabel }}<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ f.onSave }}\" aria-pressed=\"{{ f.saved }}\" aria-label=\"{{ f.saveAria }}\" style=\"padding:10px 14px;border-radius:999px;background:{{ f.saveBg }};font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ f.saveLabel }}<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ f.onShare }}\" aria-label=\"{{ f.shareAria }}\" style=\"padding:10px 14px;border-radius:999px;background:#FFF6E4;font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Share<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"color:#F4E8CB;font-size:15px;margin:10px 0 0;\">Drag the wall, scroll it, or use the arrow keys once it has focus.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gridMode }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;\">\n            <sc-for list=\"{{ flashItems }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <article style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:18px;padding:15px;box-shadow:6px 6px 0 #342A24;position:relative;opacity:{{ f.dim }};\">\n                <button sc-camel-on-click=\"{{ f.onOpen }}\" aria-label=\"{{ f.openLabel }}\" style=\"display:block;width:100%;padding:0;border:3px solid #342A24;border-radius:12px;overflow:hidden;background:#FFF6E4;cursor:pointer;\">\n                  <img src=\"{{ f.src }}\" alt=\"{{ f.alt }}\" width=\"700\" height=\"700\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n                <\u002Fbutton>\n                <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:20px;margin:12px 0 8px;\">{{ f.title }}<\u002Fh3>\n                <dl style=\"margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:15px;\">\n                  <dt style=\"font-weight:800;\">Artist<\u002Fdt><dd style=\"margin:0;\">{{ f.artist }}<\u002Fdd>\n                  <dt style=\"font-weight:800;\">Size<\u002Fdt><dd style=\"margin:0;\">{{ f.sizeLabel }}<\u002Fdd>\n                  <dt style=\"font-weight:800;\">Placement<\u002Fdt><dd style=\"margin:0;\">{{ f.placement }}<\u002Fdd>\n                  <dt style=\"font-weight:800;\">Ink<\u002Fdt><dd style=\"margin:0;\">{{ f.ink }}<\u002Fdd>\n                  <dt style=\"font-weight:800;\">Repeat<\u002Fdt><dd style=\"margin:0;\">{{ f.repeatLabel }}<\u002Fdd>\n                  <dt style=\"font-weight:800;\">Pricing<\u002Fdt><dd style=\"margin:0;\">{{ f.price }}<\u002Fdd>\n                <\u002Fdl>\n                <p style=\"margin:0 0 10px;\"><span style=\"display:inline-block;padding:5px 12px;border-radius:999px;border:2px solid #342A24;font-weight:800;font-size:13px;background:{{ f.statusBg }};\">{{ f.statusIcon }} {{ f.statusLabel }}<\u002Fspan><\u002Fp>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ f.onRequest }}\" style=\"padding:10px 15px;border-radius:999px;background:{{ f.btnBg }};color:{{ f.btnFg }};font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ f.btnLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ f.onSave }}\" aria-pressed=\"{{ f.saved }}\" aria-label=\"{{ f.saveAria }}\" style=\"padding:10px 14px;border-radius:999px;background:{{ f.saveBg }};font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ f.saveLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ f.onShare }}\" aria-label=\"{{ f.shareAria }}\" style=\"padding:10px 14px;border-radius:999px;background:#FFF6E4;font-weight:800;font-size:14px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Share<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div id=\"gw-wall-skip\" style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:26px;\">\n          <button sc-camel-on-click=\"{{ sunEgg }}\" aria-label=\"A little sun. Press it and see.\" style=\"width:56px;height:56px;border-radius:50%;background:#D4A636;border:3px solid #342A24;font-size:22px;cursor:pointer;\">☀<\u002Fbutton>\n          <p style=\"margin:0;color:#F4E8CB;font-family:Caveat,cursive;font-size:24px;\">{{ eggText }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ viewerOpen }}\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ viewerTitle }}\" style=\"position:fixed;inset:0;z-index:130;background:rgba(52,42,36,0.95);display:grid;grid-template-rows:auto 1fr;padding:10px;\" sc-camel-on-touch-start=\"{{ onTouchStart }}\" sc-camel-on-touch-end=\"{{ onTouchEnd }}\">\n      <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center;\">\n        <div style=\"display:flex;gap:10px;\">\n          <button sc-camel-on-click=\"{{ viewerPrev }}\" aria-label=\"Previous design\" style=\"padding:12px 18px;border-radius:999px;border:3px solid #F4E8CB;background:none;color:#F4E8CB;font-weight:800;cursor:pointer;min-height:44px;\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ viewerNext }}\" aria-label=\"Next design\" style=\"padding:12px 18px;border-radius:999px;border:3px solid #F4E8CB;background:none;color:#F4E8CB;font-weight:800;cursor:pointer;min-height:44px;\">→<\u002Fbutton>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeViewer }}\" aria-label=\"Close viewer\" style=\"width:52px;height:52px;border-radius:50%;border:3px solid #F4E8CB;background:#D86E3D;color:#FFF6E4;font-size:22px;font-weight:800;cursor:pointer;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start;overflow-y:auto;padding:12px 0 calc(16px + env(safe-area-inset-bottom));\">\n        <div style=\"display:grid;place-items:center;\">{{ viewerImage }}<\u002Fdiv>\n        <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:20px;padding:20px;\">\n          <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px;\">{{ viewerTitle }}<\u002Fh2>\n          <p style=\"margin:0 0 10px;\"><span style=\"display:inline-block;padding:6px 13px;border-radius:999px;border:2px solid #342A24;font-weight:800;font-size:14px;background:{{ viewerStatusBg }};\">{{ viewerStatusIcon }} {{ viewerStatusLabel }}<\u002Fspan><\u002Fp>\n          <dl style=\"margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px;\">\n            <dt style=\"font-weight:800;\">Artist<\u002Fdt><dd style=\"margin:0;\">{{ viewerArtist }}<\u002Fdd>\n            <dt style=\"font-weight:800;\">Size<\u002Fdt><dd style=\"margin:0;\">{{ viewerSize }}<\u002Fdd>\n            <dt style=\"font-weight:800;\">Placement<\u002Fdt><dd style=\"margin:0;\">{{ viewerPlacement }}<\u002Fdd>\n            <dt style=\"font-weight:800;\">Ink<\u002Fdt><dd style=\"margin:0;\">{{ viewerInk }}<\u002Fdd>\n            <dt style=\"font-weight:800;\">Repeat<\u002Fdt><dd style=\"margin:0;\">{{ viewerRepeat }}<\u002Fdd>\n            <dt style=\"font-weight:800;\">Pricing<\u002Fdt><dd style=\"margin:0;\">{{ viewerPrice }}<\u002Fdd>\n          <\u002Fdl>\n          <p style=\"font-family:Caveat,cursive;font-size:23px;margin:0 0 16px;color:#5A4A3E;\">“{{ viewerNote }}”<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n            <button sc-camel-on-click=\"{{ viewerRequest }}\" style=\"padding:13px 20px;border-radius:999px;background:{{ viewerBtnBg }};color:{{ viewerBtnFg }};font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">{{ viewerBtnLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viewerSave }}\" style=\"padding:13px 20px;border-radius:999px;background:{{ viewerSaveBg }};font-weight:800;font-size:16px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">{{ viewerSaveLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viewerShare }}\" style=\"padding:13px 20px;border-radius:999px;background:#FFF6E4;font-weight:800;font-size:16px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Share<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viewerArtistPage }}\" style=\"padding:13px 20px;border-radius:999px;background:#86B5C4;font-weight:800;font-size:16px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">See the artist<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:15px;line-height:1.6;\">Requesting a design doesn't reserve it or book an appointment — the artist confirms availability, placement, pricing and deposit.<\u002Fp>\n          <sc-if value=\"{{ hasSimilar }}\">\n            <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:20px;margin:18px 0 10px;\">Similar designs<\u002Fh3>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ similar }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <button sc-camel-on-click=\"{{ s.onOpen }}\" aria-label=\"{{ s.openLabel }}\" style=\"width:84px;padding:0;border:3px solid #342A24;border-radius:10px;overflow:hidden;background:none;cursor:pointer;\">\n                  <img src=\"{{ s.src }}\" alt=\"{{ s.alt }}\" width=\"200\" height=\"200\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:1;object-fit:cover;\">\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\">\n    <p role=\"status\" style=\"position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:140;background:#342A24;color:#FFF6E4;padding:14px 22px;border-radius:999px;font-weight:800;font-size:16px;box-shadow:4px 4px 0 rgba(0,0,0,0.3);margin:0;max-width:90vw;text-align:center;\">{{ toast }}<\u002Fp>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEvents }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1200px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,64px);margin:0 0 10px;\">Good World Gets Around<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.7;max-width:60ch;margin:0 0 32px;\">From Sacramento art shows to tattoo pop-ups in Tokyo, Good World is built around meeting people, sharing ideas and making art in unexpected places.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:26px;\">\n          <sc-for list=\"{{ events }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <article style=\"border:3px solid #342A24;border-radius:18px;overflow:hidden;box-shadow:8px 8px 0 #342A24;background:{{ e.bg }};\">\n              <div style=\"padding:26px 20px;border-bottom:3px solid #342A24;text-align:center;\">\n                <p style=\"font-family:Caveat,cursive;font-size:24px;margin:0;\">{{ e.kicker }}<\u002Fp>\n                <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:29px;line-height:1.05;margin:6px 0;\">{{ e.title }}<\u002Fh2>\n                <p style=\"font-weight:800;letter-spacing:0.07em;text-transform:uppercase;font-size:14px;margin:0;\">{{ e.when }} · {{ e.where }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:20px;background:#FFF6E4;\">\n                <p style=\"margin:0 0 12px;line-height:1.65;font-size:17px;\">{{ e.body }}<\u002Fp>\n                <p style=\"margin:0 0 14px;font-weight:800;color:#B04A28;\">{{ e.who }}<\u002Fp>\n                <p style=\"margin:0;\"><span style=\"display:inline-block;padding:6px 14px;border-radius:999px;border:2px dashed #342A24;font-weight:800;font-size:14px;\">{{ e.status }}<\u002Fspan><\u002Fp>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:34px;background:#86B5C4;border:3px solid #342A24;border-radius:20px;padding:24px;box-shadow:7px 7px 0 #342A24;\">\n          <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:27px;margin:0 0 10px;\">Guest Artists &amp; Tokyo Pop-Ups<\u002Fh2>\n          <p style=\"margin:0;line-height:1.7;font-size:17px;\">Guest spots and travel dates get announced here first. If you want to guest at Good World — or you're hosting something and want us there — send a note through the booking form. Confirmed dates, host studios and photo galleries fill in once the shop supplies them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStudio }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1100px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,62px);margin:0 0 16px;\">A Chill Place to Get Tattooed<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.7;max-width:62ch;margin:0 0 16px;\">The shop is clean, professional and genuinely relaxed. Music on, art on every wall, plants in the window, usually a conversation happening. Nobody here will make you feel small for asking a question.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.7;max-width:62ch;margin:0 0 30px;\">First tattoo? You're in good hands. We'll walk you through what the day looks like, how it feels, and what happens after.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;\">\n          <img src=\"b55cb45a-9e87-48ff-8ef2-3464c0bb458d\" alt=\"Fresh gloves laid out before a tattoo session\" width=\"700\" height=\"520\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border:3px solid #342A24;border-radius:14px;box-shadow:6px 6px 0 #342A24;\">\n          <img src=\"02c3abc0-15f2-4c85-b788-783a6bcd6316\" alt=\"Hand-drawn dragon stencils on the drawing table\" width=\"700\" height=\"520\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border:3px solid #342A24;border-radius:14px;box-shadow:6px 6px 0 #342A24;\">\n          <img src=\"3189540b-71b2-4861-9d96-4adce9c0e5fa\" alt=\"Black and grey tattoo in progress\" width=\"700\" height=\"520\" loading=\"lazy\" style=\"width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border:3px solid #342A24;border-radius:14px;box-shadow:6px 6px 0 #342A24;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#775D7B;border-top:4px solid #342A24;border-bottom:4px solid #342A24;padding:clamp(36px,6vw,76px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1100px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(26px,4.4vw,46px);margin:0 0 24px;color:#FFF6E4;\">What We're About<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(226px,1fr));gap:20px;\">\n          <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"5\">\n            <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:18px;padding:20px;box-shadow:5px 5px 0 #342A24;\">\n              <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 8px;\">{{ v.title }}<\u002Fh3>\n              <p style=\"margin:0;line-height:1.6;font-size:17px;\">{{ v.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"padding:clamp(36px,6vw,76px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1100px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(26px,4.4vw,46px);margin:0 0 6px;\">Notes From Good People<\u002Fh2>\n        <p style=\"font-family:Caveat,cursive;font-size:26px;color:#B04A28;margin:0 0 22px;\">Real reviews only, linked to their source.<\u002Fp>\n        <div style=\"background:#FFF6E4;border:3px dashed #342A24;border-radius:20px;padding:26px;max-width:640px;\">\n          <p style=\"margin:0 0 10px;font-weight:800;\">No reviews published here yet.<\u002Fp>\n          <p style=\"margin:0;line-height:1.65;font-size:17px;\">We don't write our own testimonials. Once the shop shares links to verified Google or Yelp reviews, they'll appear here as pinned notes with a link back to the original.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#D4A636;border-top:4px solid #342A24;padding:clamp(36px,6vw,76px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1100px;margin:0 auto;\">\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(26px,4.4vw,46px);margin:0 0 6px;\">Stuff From the Studio<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.7;max-width:58ch;margin:0 0 24px;\">Prints, flash books, stickers, shirts, zines and the occasional original painting — like browsing a table at an art fair.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;\">\n          <sc-for list=\"{{ merch }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:16px;padding:18px;box-shadow:5px 5px 0 #342A24;\">\n              <h3 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:20px;margin:0 0 6px;\">{{ m.title }}<\u002Fh3>\n              <p style=\"margin:0 0 10px;line-height:1.6;font-size:16px;\">{{ m.body }}<\u002Fp>\n              <p style=\"margin:0;font-weight:800;font-size:14px;background:#86B5C4;display:inline-block;padding:5px 12px;border-radius:999px;border:2px solid #342A24;\">Photos &amp; pricing needed<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isWalkins }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:800px;margin:0 auto;text-align:center;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,62px);margin:0 0 14px;\">Got an Idea Today?<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.7;margin:0 0 10px;\">Walk-ins are welcome whenever we have space. Smaller tattoos and available flash usually work best for same-day appointments. Send us a message or stop by and say hello.<\u002Fp>\n        <p style=\"font-family:Caveat,cursive;font-size:26px;color:#B04A28;margin:0 0 28px;\">No idea is too strange.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:32px;\">\n          <button sc-camel-on-click=\"{{ goFlash }}\" style=\"padding:14px 26px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Browse Available Flash<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goBooking }}\" style=\"padding:14px 26px;border-radius:999px;background:#D4A636;color:#342A24;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Bring Us Your Idea<\u002Fbutton>\n          <a href=\"https://maps.google.com/?q=2401+15th+Street+Sacramento+CA+95818\" target=\"_blank\" rel=\"noopener\" style=\"padding:14px 26px;border-radius:999px;background:#FFF6E4;color:#342A24;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;\">Get Directions<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"background:#FFF6E4;border:3px dashed #342A24;border-radius:18px;padding:22px;text-align:left;margin:0;line-height:1.7;font-size:17px;\">We can't guarantee same-day availability — it depends who's in the shop and what's already booked. Live availability, shop hours and the best number to reach us still need to come from the studio.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBooking }}\">\n    <section style=\"background:#438A84;border-bottom:4px solid #342A24;padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:800px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,62px);margin:0 0 12px;color:#FFF6E4;\">Let's Make Something<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.7;color:#FFF6E4;margin:0 0 26px;\">You don't need to write the perfect tattoo request. Tell us what you're thinking, share any pictures you have, and we'll help you figure out the next step.<\u002Fp>\n\n        <sc-if value=\"{{ submitted }}\">\n          <div role=\"status\" style=\"background:#D4A636;border:3px solid #342A24;border-radius:22px;padding:34px;box-shadow:8px 8px 0 #342A24;text-align:center;\">\n            <p style=\"font-family:Shrikhand,Georgia,serif;font-size:27px;margin:0 0 12px;line-height:1.25;\">Nice. Your idea is officially in the universe.<\u002Fp>\n            <p style=\"font-size:18px;line-height:1.65;margin:0 0 20px;\">Someone from Good World will reach out with availability and next steps. Appointments aren't confirmed until we've talked it through.<\u002Fp>\n            <button sc-camel-on-click=\"{{ resetForm }}\" style=\"padding:13px 24px;border-radius:999px;background:#342A24;color:#FFF6E4;font-weight:800;font-size:16px;border:3px solid #342A24;cursor:pointer;min-height:44px;\">Send Another Idea<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:8px 8px 0 #342A24;\">\n            <ol style=\"list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 22px;\">\n              <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <li style=\"flex:1 1 120px;\"><span style=\"display:block;padding:8px 10px;border-radius:12px;border:3px solid #342A24;font-weight:800;font-size:14px;text-align:center;background:{{ s.bg }};color:{{ s.fg }};\">{{ s.n }}. {{ s.label }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n\n            <sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;gap:18px;\">\n                <sc-if value=\"{{ requestedTitle }}\">\n                  <div style=\"display:flex;gap:14px;align-items:center;background:#F4E8CB;border:3px solid #342A24;border-radius:16px;padding:12px;\">\n                    {{ requestedImage }}\n                    <span style=\"font-weight:800;\">{{ requestedTitle }}<br><span style=\"font-weight:600;font-size:15px;\">{{ requestedMeta }}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">What are you thinking about? <span style=\"font-weight:600;font-size:15px;\">Required. A rough idea, a sketch, a strange dream — anything.<\u002Fspan>\n                  <textarea value=\"{{ f_idea }}\" sc-camel-on-change=\"{{ setIdea }}\" rows=\"4\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;resize:vertical;\"><\u002Ftextarea>\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">What feeling should it have?\n                  <input value=\"{{ f_mood }}\" sc-camel-on-change=\"{{ setMood }}\" placeholder=\"Peaceful, funny, weird, bold…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ step2 }}\">\n              <div style=\"display:grid;gap:18px;\">\n                <label style=\"display:grid;gap:6px;font-weight:800;\">About how large should it be?\n                  <input value=\"{{ f_size }}\" sc-camel-on-change=\"{{ setSize }}\" placeholder=\"Palm-sized, forearm, full sleeve…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Where would you like the tattoo?\n                  <input value=\"{{ f_placement }}\" sc-camel-on-change=\"{{ setPlacement }}\" placeholder=\"Forearm, calf, ribs…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ step3 }}\">\n              <div style=\"display:grid;gap:18px;\">\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Is there an artist you prefer?\n                  <sc-raw-select value=\"{{ f_artist }}\" sc-camel-on-change=\"{{ setArtist }}\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;min-height:44px;\">\n                    <option>Not sure — help me pick<\u002Foption>\n                    <option>Eric Goodman<\u002Foption>\n                    <option>Aaron Charley<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Style you're drawn to\n                  <input value=\"{{ f_style }}\" sc-camel-on-change=\"{{ setStyle }}\" placeholder=\"Traditional, illustrative, fine line…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Color or black-and-grey?\n                  <sc-raw-select value=\"{{ f_color }}\" sc-camel-on-change=\"{{ setColor }}\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;min-height:44px;\">\n                    <option>Not sure yet<\u002Foption>\n                    <option>Color<\u002Foption>\n                    <option>Black and grey<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ step4 }}\">\n              <div style=\"display:grid;gap:18px;\">\n                <label style=\"display:grid;gap:6px;font-weight:800;\">What days usually work for you?\n                  <input value=\"{{ f_dates }}\" sc-camel-on-change=\"{{ setDates }}\" placeholder=\"Weekends, weekday mornings, flexible…\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Budget you're working with <span style=\"font-weight:600;font-size:15px;\">Optional. A range is fine — it helps us plan the size and detail.<\u002Fspan>\n                  <input value=\"{{ f_budget }}\" sc-camel-on-change=\"{{ setBudget }}\" inputmode=\"numeric\" placeholder=\"e.g. a rough range\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ step5 }}\">\n              <div style=\"display:grid;gap:18px;\">\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Show us what's inspiring you. <span style=\"font-weight:600;font-size:15px;\">JPG, PNG or HEIC, up to about 10 MB each. A photo of the spot on your body helps too.<\u002Fspan>\n                  <input type=\"file\" multiple=\"\" accept=\"image/*\" capture=\"environment\" style=\"padding:13px 14px;border:3px dashed #342A24;border-radius:12px;font-size:15px;background:#fff;min-height:44px;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">What should we call you? <span style=\"font-weight:600;font-size:15px;\">Required.<\u002Fspan>\n                  <input value=\"{{ f_name }}\" sc-camel-on-change=\"{{ setName }}\" autocomplete=\"name\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Email <span style=\"font-weight:600;font-size:15px;\">Required — this is how we reply.<\u002Fspan>\n                  <input value=\"{{ f_email }}\" sc-camel-on-change=\"{{ setEmail }}\" type=\"email\" inputmode=\"email\" autocomplete=\"email\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Phone <span style=\"font-weight:600;font-size:15px;\">Optional.<\u002Fspan>\n                  <input value=\"{{ f_phone }}\" sc-camel-on-change=\"{{ setPhone }}\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:6px;font-weight:800;\">Anything else we should know?\n                  <textarea value=\"{{ f_notes }}\" sc-camel-on-change=\"{{ setNotes }}\" rows=\"3\" style=\"padding:13px 14px;border:3px solid #342A24;border-radius:12px;font-size:16px;background:#fff;resize:vertical;\"><\u002Ftextarea>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hasError }}\">\n              <p role=\"alert\" style=\"margin:18px 0 0;background:#CE858A;border:3px solid #342A24;border-radius:12px;padding:13px 16px;font-weight:800;\">{{ errorText }}<\u002Fp>\n            <\u002Fsc-if>\n\n            <p style=\"margin:14px 0 0;font-size:15px;font-weight:600;\">Your answers are saved in this browser as you go, so you can step back without losing anything.<\u002Fp>\n\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;\">\n              <sc-if value=\"{{ canGoBack }}\">\n                <button sc-camel-on-click=\"{{ prevStep }}\" style=\"padding:14px 24px;border-radius:999px;background:#FFF6E4;color:#342A24;font-weight:800;font-size:16px;border:3px solid #342A24;box-shadow:4px 4px 0 #342A24;cursor:pointer;min-height:44px;\">← Back<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notLastStep }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ nextStep }}\" style=\"padding:14px 28px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Next step →<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lastStep }}\">\n                <button sc-camel-on-click=\"{{ onSubmit }}\" style=\"padding:14px 30px;border-radius:999px;background:#D86E3D;color:#FFF6E4;font-weight:800;font-size:17px;border:3px solid #342A24;box-shadow:5px 5px 0 #342A24;cursor:pointer;min-height:44px;\">Send It Over<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ clearForm }}\" style=\"padding:14px 22px;border-radius:999px;background:none;color:#342A24;font-weight:800;font-size:16px;border:3px dashed #342A24;cursor:pointer;min-height:44px;\">Clear form<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCare }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:880px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,60px);margin:0 0 24px;\">Before &amp; After<\u002Fh1>\n        <div style=\"background:#D4A636;border:3px solid #342A24;border-radius:20px;padding:26px;box-shadow:7px 7px 0 #342A24;margin-bottom:24px;\">\n          <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:28px;margin:0 0 14px;\">Getting Ready<\u002Fh2>\n          <ul style=\"margin:0;padding-left:22px;line-height:1.85;font-size:17px;\">\n            <li>Eat a real meal before you come in, and bring a snack and water.<\u002Fli>\n            <li>Sleep well the night before. Rested and sober makes for a better session.<\u002Fli>\n            <li>Wear comfortable clothes that give easy access to the area.<\u002Fli>\n            <li>Bring headphones, a book or a friend if that helps you settle.<\u002Fli>\n            <li>Skip sunburn and heavy lotion on the area that day.<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:16px 0 0;font-weight:800;\">Deposit, ID and age requirements: to be confirmed by the shop.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#86B5C4;border:3px solid #342A24;border-radius:20px;padding:26px;box-shadow:7px 7px 0 #342A24;margin-bottom:24px;\">\n          <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:28px;margin:0 0 14px;\">Aftercare<\u002Fh2>\n          <p style=\"margin:0 0 14px;line-height:1.75;font-size:17px;\">Your artist sends you home with instructions for your specific tattoo — follow those first. General good practice: keep it clean, moisturize lightly, stay out of the sun, and don't pick.<\u002Fp>\n          <p style=\"margin:0;font-weight:800;\">The shop's official written aftercare sheet still needs to be supplied and will replace this placeholder.<\u002Fp>\n        <\u002Fdiv>\n        <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,42px);margin:34px 0 16px;\">Questions People Ask<\u002Fh2>\n        <div style=\"display:grid;gap:12px;\">\n          <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <details style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:16px;padding:16px 20px;box-shadow:5px 5px 0 #342A24;\">\n              <summary style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:20px;cursor:pointer;min-height:44px;display:flex;align-items:center;\">{{ q.q }}<\u002Fsummary>\n              <p style=\"margin:12px 0 0;line-height:1.7;font-size:17px;\">{{ q.a }}<\u002Fp>\n            <\u002Fdetails>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isVisit }}\">\n    <section style=\"padding:clamp(30px,5vw,64px) clamp(18px,5vw,64px);\">\n      <div style=\"max-width:1050px;margin:0 auto;\">\n        <h1 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,62px);margin:0 0 20px;\">Come Say Hello<\u002Fh1>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;align-items:start;\">\n          <div style=\"background:#FFF6E4;border:3px solid #342A24;border-radius:20px;padding:24px;box-shadow:7px 7px 0 #342A24;\">\n            <h2 style=\"font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:26px;margin:0 0 10px;\">Good World Tattoo<\u002Fh2>\n            <address style=\"font-style:normal;font-size:19px;line-height:1.6;margin:0 0 16px;\">2401 15th Street<br>Sacramento, California 95818<\u002Faddress>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n              <button sc-camel-on-click=\"{{ copyAddress }}\" style=\"padding:12px 20px;border-radius:999px;background:#D4A636;color:#342A24;font-weight:800;font-size:16px;borde
